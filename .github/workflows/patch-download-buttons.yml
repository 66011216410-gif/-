name: Add processed-data download button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("appนิสิตปัจจุบัน.py")
          workflow = Path(".github/workflows/patch-download-buttons.yml")
          text = app.read_text(encoding="utf-8")

          if "ดาวน์โหลดเฉพาะข้อมูลประมวลผล" in text:
              workflow.unlink(missing_ok=True)
              raise SystemExit(0)

          marker = '''        use_container_width=True,\n    )'''
          pos = text.rfind(marker)
          if pos == -1:
              raise SystemExit("Could not find the existing Excel download button")

          end = pos + len(marker)
          addition = '''\n\n    processed_excel = io.BytesIO()\n    with pd.ExcelWriter(processed_excel, engine="openpyxl") as writer:\n        processed.to_excel(writer, index=False, sheet_name="ข้อมูลประมวลผล")\n    processed_excel.seek(0)\n\n    st.download_button(\n        "⬇️ 4) ดาวน์โหลดเฉพาะข้อมูลประมวลผล",\n        data=processed_excel.getvalue(),\n        file_name="ข้อมูลประมวลผล.xlsx",\n        mime="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",\n        use_container_width=True,\n    )'''

          app.write_text(text[:end] + addition + text[end:], encoding="utf-8")
          workflow.unlink(missing_ok=True)
          PY

      - name: Commit app change
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add separate processed-data download"
          git push
